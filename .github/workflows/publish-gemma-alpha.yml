name: Publish Gemma alpha2 APK

on:
  push:
    branches:
      - experiment/gemma-3-1b

permissions:
  contents: write

jobs:
  release:
    name: Build and publish signed alpha2 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate release secrets
        shell: bash
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for name in RELEASE_KEYSTORE_B64 RELEASE_STORE_PASSWORD RELEASE_KEY_PASSWORD RELEASE_KEY_ALIAS; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required environment secret: $name"
              exit 1
            fi
          done

      - name: Restore signing identity
        shell: bash
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > transcribe-release.jks
          chmod 600 transcribe-release.jks
          {
            echo "storeFile=transcribe-release.jks"
            echo "storePassword=$RELEASE_STORE_PASSWORD"
            echo "keyAlias=$RELEASE_KEY_ALIAS"
            echo "keyPassword=$RELEASE_KEY_PASSWORD"
          } > keystore.properties
          chmod 600 keystore.properties

      - name: Verify expected signing certificate
        shell: bash
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          EXPECTED="F8:45:DB:90:80:06:0A:59:9D:80:00:99:34:52:93:D7:4C:7E:C4:24:51:49:E5:18:C8:43:0E:0D:AC:B4:B6:E0"
          ACTUAL="$(keytool -list -v \
            -keystore transcribe-release.jks \
            -storepass "$RELEASE_STORE_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS" \
            | sed -n 's/.*SHA256: //p' \
            | head -n 1)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Signing certificate mismatch."
            echo "Expected: $EXPECTED"
            echo "Actual:   $ACTUAL"
            exit 1
          fi

      - name: Build signed release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            "$APK"

      - name: Prepare alpha2 asset
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="TranscribeOffline-0.4.0-alpha2-gemma3-1b.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUTPUT"
          sha256sum "$OUTPUT" | tee "$OUTPUT.sha256"

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v0.4.0-alpha2"
          gh release delete "$TAG" --repo "$REPO" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            TranscribeOffline-0.4.0-alpha2-gemma3-1b.apk \
            TranscribeOffline-0.4.0-alpha2-gemma3-1b.apk.sha256 \
            --repo "$REPO" \
            --title "Transcribe Offline v0.4.0-alpha2 — Gemma 3 1B" \
            --notes "Second fully offline writing benchmark. Replaces the 0.5B Qwen experiment with Gemma 3 1B IT QAT Q4_0 and uses the GGUF model chat template. Main remains on the validated 0.3.4 line." \
            --prerelease \
            --target "$GITHUB_SHA"
