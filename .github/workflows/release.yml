name: Publish signed release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: signed-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Build and sign release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate release secrets
        shell: bash
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for name in RELEASE_KEYSTORE_B64 RELEASE_STORE_PASSWORD RELEASE_KEY_PASSWORD RELEASE_KEY_ALIAS; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required environment secret: $name"
              exit 1
            fi
          done

      - name: Restore signing identity
        shell: bash
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > transcribe-release.jks
          chmod 600 transcribe-release.jks
          {
            echo "storeFile=transcribe-release.jks"
            echo "storePassword=$RELEASE_STORE_PASSWORD"
            echo "keyAlias=$RELEASE_KEY_ALIAS"
            echo "keyPassword=$RELEASE_KEY_PASSWORD"
          } > keystore.properties
          chmod 600 keystore.properties

      - name: Verify expected signing certificate
        shell: bash
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          EXPECTED="F8:45:DB:90:80:06:0A:59:9D:80:00:99:34:52:93:D7:4C:7E:C4:24:51:49:E5:18:C8:43:0E:0D:AC:B4:B6:E0"
          ACTUAL="$(keytool -list -v             -keystore transcribe-release.jks             -storepass "$RELEASE_STORE_PASSWORD"             -alias "$RELEASE_KEY_ALIAS"             | sed -n 's/.*SHA256: //p'             | head -n 1)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Signing certificate mismatch."
            echo "Expected: $EXPECTED"
            echo "Actual:   $ACTUAL"
            exit 1
          fi
          echo "Stable signing certificate verified."

      - name: Build signed release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Report APK size breakdown
        shell: bash
        run: |
          python3 - <<'PY'
          from collections import defaultdict
          from pathlib import Path
          from zipfile import ZipFile

          apk = Path("app/build/outputs/apk/release/app-release.apk")
          groups = defaultdict(lambda: [0, 0])
          with ZipFile(apk) as archive:
              for item in archive.infolist():
                  if item.is_dir():
                      continue
                  name = item.filename
                  if name.endswith((".gguf", ".bin")) and name.startswith("assets/"):
                      category = "AI models"
                  elif name.startswith("lib/"):
                      category = "Native libraries"
                  elif name.startswith("classes") and name.endswith(".dex"):
                      category = "DEX code"
                  elif name.startswith("res/") or name == "resources.arsc":
                      category = "Android resources"
                  else:
                      category = "Other"
                  groups[category][0] += item.compress_size
                  groups[category][1] += item.file_size
          print(f"APK total: {apk.stat().st_size / 1048576:.1f} MiB")
          for category, (packed, unpacked) in sorted(groups.items(), key=lambda x: -x[1][0]):
              print(f"{category}: packed {packed / 1048576:.1f} MiB; unpacked {unpacked / 1048576:.1f} MiB")
          PY

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify             --verbose             --print-certs             "$APK"

      - name: Verify packaged version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          VERSION="$(printf '%s\n' "$BADGING" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p")"
          CODE="$(printf '%s\n' "$BADGING" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p")"
          test -n "$VERSION"
          test -n "$CODE"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "${GITHUB_REF_NAME#v}" != "$VERSION" ]]; then
            echo "::error::Release tag does not match packaged version $VERSION"
            exit 1
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Verified APK version $VERSION (code $CODE)"

      - name: Name release APK
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.name }}"
          OUTPUT="Loquia-${VERSION}-official.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUTPUT"
          echo "file=$OUTPUT" >> "$GITHUB_OUTPUT"
          sha256sum "$OUTPUT" | tee "$OUTPUT.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: loquia-signed-release
          path: |
            ${{ steps.package.outputs.file }}
            ${{ steps.package.outputs.file }}.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          APK_FILE: ${{ steps.package.outputs.file }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${{ steps.version.outputs.name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Recover an existing release that was created without its APK.
            if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq "$APK_FILE"; then
              echo "::error::Release $TAG already contains $APK_FILE. Bump versionName and versionCode before publishing a new APK; existing releases are never silently reused."
              exit 1
            fi
            echo "Release $TAG exists but is missing $APK_FILE; uploading the signed APK."
            gh release upload "$TAG" "$APK_FILE" "$APK_FILE.sha256"
          else
            gh release create "$TAG" "$APK_FILE" "$APK_FILE.sha256" \
              --target "$GITHUB_SHA" --title "Loquia ${{ steps.version.outputs.name }}" \
              --generate-notes
          fi
