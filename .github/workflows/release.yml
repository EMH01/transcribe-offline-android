name: Publish signed release

on:
  push:
    tags:
      - "v*"
    branches:
      - feature/offline-chat-assistant
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and sign release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: release
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate release secrets
        shell: bash
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for name in RELEASE_KEYSTORE_B64 RELEASE_STORE_PASSWORD RELEASE_KEY_PASSWORD RELEASE_KEY_ALIAS; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required environment secret: $name"
              exit 1
            fi
          done

      - name: Restore signing identity
        shell: bash
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > transcribe-release.jks
          chmod 600 transcribe-release.jks
          {
            echo "storeFile=transcribe-release.jks"
            echo "storePassword=$RELEASE_STORE_PASSWORD"
            echo "keyAlias=$RELEASE_KEY_ALIAS"
            echo "keyPassword=$RELEASE_KEY_PASSWORD"
          } > keystore.properties
          chmod 600 keystore.properties

      - name: Verify expected signing certificate
        shell: bash
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          EXPECTED="F8:45:DB:90:80:06:0A:59:9D:80:00:99:34:52:93:D7:4C:7E:C4:24:51:49:E5:18:C8:43:0E:0D:AC:B4:B6:E0"
          ACTUAL="$(keytool -list -v             -keystore transcribe-release.jks             -storepass "$RELEASE_STORE_PASSWORD"             -alias "$RELEASE_KEY_ALIAS"             | sed -n 's/.*SHA256: //p'             | head -n 1)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Signing certificate mismatch."
            echo "Expected: $EXPECTED"
            echo "Actual:   $ACTUAL"
            exit 1
          fi
          echo "Stable signing certificate verified."

      - name: Verify source revision before build
        shell: bash
        run: |
          set -euo pipefail
          echo "Building commit: $GITHUB_SHA"
          grep -Fq 'versionCode = 15' app/build.gradle.kts || { echo "::error::Expected alpha6 versionCode 15 missing from checked-out source"; exit 1; }
          grep -Fq 'versionName = "0.4.0-alpha6"' app/build.gradle.kts || { echo "::error::Expected alpha6 versionName missing from checked-out source"; exit 1; }

      - name: Build signed release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK identity and version
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 1)"
          echo "$BADGING"
          [[ "$BADGING" == *"com.emh01.transcribeoffline"* ]] || { echo "::error::Unexpected application ID"; exit 1; }
          [[ "$BADGING" == *"versionCode=\'15\'"* && "$BADGING" == *"versionName=\'0.4.0-alpha6\'"* ]] || { echo "::error::Unexpected version; refusing to publish"; exit 1; }

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify             --verbose             --print-certs             "$APK"

      - name: Name release APK
        id: package
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.4.0-alpha6-build-${GITHUB_RUN_NUMBER}"
          fi
          OUTPUT="TranscribeOffline-${VERSION}-official.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUTPUT"
          echo "file=$OUTPUT" >> "$GITHUB_OUTPUT"
          sha256sum "$OUTPUT" | tee "$OUTPUT.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: transcribe-offline-signed-release
          path: |
            ${{ steps.package.outputs.file }}
            ${{ steps.package.outputs.file }}.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_FILE: ${{ steps.package.outputs.file }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            gh release create "$GITHUB_REF_NAME" "$APK_FILE" "$APK_FILE.sha256" --title "Transcribe Offline $GITHUB_REF_NAME" --generate-notes
          else
            TEST_TAG="chat-alpha6-build-${GITHUB_RUN_NUMBER}"
            gh release create "$TEST_TAG" "$APK_FILE" "$APK_FILE.sha256" --target "$GITHUB_SHA" --title "Transcribe Offline 0.4.0-alpha6 (build ${GITHUB_RUN_NUMBER})" --prerelease --notes "Signed test build of the offline conversational Chat branch. Parakeet + Gemma, version 0.4.0-alpha6."
          fi
