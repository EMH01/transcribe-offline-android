name: Debug Android startup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Compare optimized and unoptimized startup
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify action PNG resources
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib
          for name in ("ic_action_microphone.png", "ic_action_send.png"):
              path = Path("app/src/main/res/drawable-nodpi") / name
              data = path.read_bytes()
              assert data.startswith(b"\\x89PNG\\r\\n\\x1a\\n"), f"{name}: invalid PNG signature"
              with Image.open(path) as image:
                  assert image.format == "PNG", f"{name}: expected PNG, got {image.format}"
                  image.verify()
              with Image.open(path) as image:
                  image.load()
                  print(f"{name}: valid PNG, {image.size}, mode {image.mode}, {len(data)} bytes, SHA256 {hashlib.sha256(data).hexdigest()}")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build both diagnostic APKs
        run: gradle :app:assembleSmoke :app:assembleSmokePlain --stacktrace

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start emulator and verify Loquia startup
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disk-size: 8G
          disable-animations: true
          script: bash .github/scripts/debug-android-startup.sh
      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loquia-emulator-startup-diagnostics
          path: startup-diagnostics/
          if-no-files-found: warn

