name: Export Android signing tools

on:
  push:
    branches: [ main ]

jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
      - name: Install build tools
        run: sdkmanager "build-tools;35.0.0"
      - name: Package signing tools
        run: |
          mkdir -p signing-tools
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" signing-tools/
          cp -R "$ANDROID_HOME/build-tools/35.0.0/lib" signing-tools/
          chmod +x signing-tools/apksigner signing-tools/zipalign
      - name: Upload tools
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools-35
          path: signing-tools/
