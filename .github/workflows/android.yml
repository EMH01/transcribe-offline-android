name: Android CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "*.md"
      - "docs/**"
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Only the newest push to a branch needs CI; do not cancel manual debug or releases.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # CI checks Android/Kotlin/native compilation and resource packaging.
      # Model-download tasks remain mandatory for official signed releases.
      - name: Build lightweight debug APK (without bundled AI models)
        run: |
          gradle :app:assembleDebug \
            -x :app:prepareParakeetModel \
            -x :core-llm:prepareLocalTextModel \
            --stacktrace

      # Deliberately do not upload this APK: it lacks the offline models and
      # must not be confused with a runnable, full-featured release.
