name: Build signed release candidate

on:
  push:
    branches: [ main ]

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate temporary release signing identity
        shell: bash
        run: |
          set -euo pipefail
          PASS="$(openssl rand -hex 24)"
          echo "::add-mask::$PASS"
          keytool -genkeypair -v             -keystore transcribe-release.jks             -storepass "$PASS"             -keypass "$PASS"             -alias transcribe             -keyalg RSA             -keysize 4096             -validity 10000             -dname "CN=Transcribe Offline Android,O=EMH01,C=ES"
          {
            echo "storeFile=transcribe-release.jks"
            echo "storePassword=$PASS"
            echo "keyAlias=transcribe"
            echo "keyPassword=$PASS"
          } > keystore.properties

      - name: Build signed release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify release signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify             --verbose             --print-certs             app/build/outputs/apk/release/app-release.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: transcribe-offline-0.2.1-release
          path: app/build/outputs/apk/release/app-release.apk
